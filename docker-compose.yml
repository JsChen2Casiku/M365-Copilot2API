services:
  m365-copilot2api:
    image: ghcr.io/jschen2casiku/m365-copilot2api:latest
    build:
      context: .
    container_name: m365-copilot2api
    restart: unless-stopped
    ports:
      # 宿主机端口与监听地址联动：从 .env 的 M365_LISTEN 读取（支持 127.0.0.1:4141、0.0.0.0:4141 或直接指定端口 4141）
      - "${M365_LISTEN:-127.0.0.1:4141}:4141"
    env_file:
      - path: .env
        required: false
    environment:
      # 容器内网络监听与数据持久化目录
      M365_LISTEN: 0.0.0.0:4141
      M365_DATA_DIR: /data
      M365_CONFIG: /data/accounts.json
      M365_TOKEN_CACHE: /data/token-cache.json
      M365_SESSION_CACHE: /data/sessions.json
      M365_API_KEYS: /data/api-keys.json
      M365_ADMIN_PASSWORD_FILE: /data/admin-password

      # 管理员初始密码（若 .env 设置了且不为默认密码 admin123，将在首次部署时设为管理员密码）
      M365_ADMIN_PASSWORD: "${M365_ADMIN_PASSWORD:-}"

      # 账号上游最大并发数
      M365_ACCOUNT_DEFAULT_CONCURRENCY: "${M365_ACCOUNT_DEFAULT_CONCURRENCY:-8}"

      # 身份策略与网络
      M365_PUBLIC_IDENTITY_POLICY: "${M365_PUBLIC_IDENTITY_POLICY:-false}"
      M365_FORCE_IPV4: "${M365_FORCE_IPV4:-0}"

      # 超时与日志设置
      M365_CHAT_TIMEOUT_SECONDS: "${M365_CHAT_TIMEOUT_SECONDS:-120}"
      M365_IMAGE_TIMEOUT_SECONDS: "${M365_IMAGE_TIMEOUT_SECONDS:-150}"
      M365_LOG_LEVEL: "${M365_LOG_LEVEL:-info}"
      M365_AUTO_CLEANUP: "${M365_AUTO_CLEANUP:-true}"

      # 出站代理（可选）
      M365_PROXY: "${M365_PROXY:-}"
      M365_PROXY_POOL: "${M365_PROXY_POOL:-}"

      # 自定义 OAuth 应用凭证（可选）
      M365_BROWSER_CLIENT_ID: "${M365_BROWSER_CLIENT_ID:-}"
      M365_BROWSER_AUTHORITY: "${M365_BROWSER_AUTHORITY:-}"
      M365_BROWSER_SCOPE: "${M365_BROWSER_SCOPE:-}"
      M365_BROWSER_REDIRECT_URI: "${M365_BROWSER_REDIRECT_URI:-}"
      M365_DEVICE_CLIENT_ID: "${M365_DEVICE_CLIENT_ID:-}"
      M365_DEVICE_AUTHORITY: "${M365_DEVICE_AUTHORITY:-}"
      M365_DEVICE_SCOPE: "${M365_DEVICE_SCOPE:-}"
    volumes:
      - ${M365_DATA_DIR:-./data}:/data
